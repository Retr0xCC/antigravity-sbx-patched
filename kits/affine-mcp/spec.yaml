# syntax=docker/sandbox-kit:3
# yaml-language-server: $schema=https://raw.githubusercontent.com/docker/sandbox-kit-spec/main/schema/kit.schema.json
schemaVersion: "3"
kind: mixin
displayName: AFFiNE MCP Workspace
description: Model Context Protocol (MCP) server for AFFiNE Cloud and Self-Hosted workspaces

metadata:
  version: "1.0.0"

requires:
  - deb/jq

capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - "app.affine.pro"
          - "*.affine.pro"
          - "registry.npmjs.org"

  - type: com.docker.sandbox/lifecycle@1
    config:
      startup:
        - command: |
            set -e
            if ! command -v affine-mcp >/dev/null 2>&1; then
              npm install -g --ignore-scripts affine-mcp-server
            fi
            cfg="$HOME/.gemini/config/mcp_config.json"
            mkdir -p "$(dirname "$cfg")"
            [ -s "$cfg" ] || echo '{}' > "$cfg"
            frag=/tmp/affine-mcp.json
            cat > "$frag" <<EOF
            {
              "mcpServers": {
                "affine": {
                  "command": "affine-mcp",
                  "args": [],
                  "env": {}
                }
              }
            }
            EOF
            jq -s '.[0] * .[1]' "$cfg" "$frag" > "$cfg.tmp"
            mv "$cfg.tmp" "$cfg"
            rm -f "$frag"
          user: "1000"
          description: Register AFFiNE MCP Server in Antigravity configuration

  - type: com.docker.sandbox/agent-context@2
    config:
      content: |
        This workspace is configured with the AFFiNE MCP Server.
        - Provides 112 MCP tools for managing docs, pages, databases, and CRDT blocks.
        - To authenticate or reconfigure AFFiNE credentials, run './kits/affine-mcp/affine-setup.sh'.
        - MCP configuration is stored in ~/.gemini/config/mcp_config.json.
