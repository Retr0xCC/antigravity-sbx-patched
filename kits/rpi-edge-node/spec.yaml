# syntax=docker/sandbox-kit:3
# yaml-language-server: $schema=https://raw.githubusercontent.com/docker/sandbox-kit-spec/main/schema/kit.schema.json
schemaVersion: "3"
kind: mixin
displayName: Raspberry Pi & Edge Node Automation
description: Edge infrastructure automation toolkit with Ansible, ansible-lint, yamllint, and Go

version: "1.0.0"

capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - "galaxy.ansible.com"
          - "galaxy-api.ansible.com"
          - "*.cloudfront.net"
          - "github.com"
          - "api.github.com"
          - "proxy.golang.org"
          - "pypi.org"
          - "files.pythonhosted.org"

  - type: com.docker.sandbox/lifecycle@1
    config:
      startup:
        - command: |
            set -e
            export PATH="$HOME/.local/bin:$PATH"
            if ! grep -qs 'export PATH="\$HOME/\.local/bin:\$PATH"' "$HOME/.bashrc" 2>/dev/null; then
              echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$HOME/.bashrc"
            fi
            if [ -w "/etc/sandbox-persistent.sh" ] && ! grep -qs 'export PATH="\$HOME/\.local/bin:\$PATH"' /etc/sandbox-persistent.sh 2>/dev/null; then
              echo 'export PATH="$HOME/.local/bin:$PATH"' >> /etc/sandbox-persistent.sh
            fi
            if ! command -v ansible >/dev/null 2>&1; then
              uv tool install ansible-core
              uv tool install ansible-lint
              uv tool install yamllint
            fi
            if command -v ansible-galaxy >/dev/null 2>&1; then
              ansible-galaxy collection install community.general || true
            fi
          user: "1000"
          description: Provision Ansible and Edge automation toolchain

  - type: com.docker.sandbox/agent-context@2
    config:
      content: |
        This workspace includes an Ansible & Edge infrastructure toolchain.
        - Ansible tools (ansible, ansible-playbook, ansible-lint, yamllint) are installed in ~/.local/bin.
        - The 'community.general' collection is pre-installed.
        - When testing playbooks or syntax, run 'ansible-lint' and 'yamllint' before execution.
