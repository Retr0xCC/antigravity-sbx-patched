# syntax=docker/sandbox-kit:3
# yaml-language-server: $schema=https://raw.githubusercontent.com/docker/sandbox-kit-spec/main/schema/kit.schema.json
schemaVersion: "3"
kind: mixin
name: media-operator
displayName: Media Pipeline & Library Operator
description: Autonomous media classification, Jellyfin/Plex structure planning, and AV1/HEVC transcode plan generator.
version: "1.0.0"

capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          # Google Antigravity & AI APIs
          - "generativelanguage.googleapis.com"
          - "accounts.google.com"
          - "oauth2.googleapis.com"
          - "www.googleapis.com"
          - "lh3.googleusercontent.com"
          - "aicode.googleapis.com"
          - "cloudcode-pa.googleapis.com"
          - "daily-cloudcode-pa.googleapis.com"
          - "antigravity.google"
          - "antigravity.google.com"
          - "antigravity-unleash.goog"
          - "play.googleapis.com"
          - "safebrowsing.googleapis.com"
          - "www.gstatic.com"
          - "storage.googleapis.com"
          - "raw.githubusercontent.com"
          - "github.com"
          - "api.github.com"
          - "objects.githubusercontent.com"

          # Multimedia Metadata Resolution (IMDb, TMDb, TheTVDB, Wikipedia, OpenLibrary)
          - "imdb.com"
          - "www.imdb.com"
          - "m.media-amazon.com"
          - "themoviedb.org"
          - "api.themoviedb.org"
          - "www.themoviedb.org"
          - "image.tmdb.org"
          - "thetvdb.com"
          - "api.thetvdb.com"
          - "wikipedia.org"
          - "en.wikipedia.org"
          - "ru.wikipedia.org"
          - "wikimedia.org"
          - "openlibrary.org"
          - "covers.openlibrary.org"
          - "musicbrainz.org"

  - type: com.docker.sandbox/agent-context@2
    config:
      filename: AGENTS.md
