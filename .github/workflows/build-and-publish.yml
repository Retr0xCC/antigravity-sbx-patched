name: Build and Publish Antigravity SBX Patched Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  schedule:
    # Check daily at 03:17 UTC (off-peak minute to avoid top-of-hour queue congestion)
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      base_image:
        description: 'Upstream Base Image'
        required: true
        default: 'docker.io/sbx/antigravity-image:latest'
      force_build:
        description: 'Force rebuild even if upstream has not changed'
        type: boolean
        required: true
        default: false

concurrency:
  group: build-and-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/antigravity-sbx-patched

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine image tags
        id: meta
        run: |
          REPO_LOWER=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_LOWER="${{ env.REGISTRY }}/${REPO_LOWER}"
          TAGS="${IMAGE_LOWER}:latest"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAGS="${TAGS},${IMAGE_LOWER}:${{ github.ref_name }}"
          fi
          BASE_IMAGE="${{ github.event.inputs.base_image || 'docker.io/sbx/antigravity-image:latest' }}"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "image_lower=${REPO_LOWER}" >> "$GITHUB_OUTPUT"
          echo "base_image=${BASE_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check upstream image and patcher for updates
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          FORCE_ARGS=""
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event.inputs.force_build }}" = "true" ] || [ "${{ steps.meta.outputs.base_image }}" != "docker.io/sbx/antigravity-image:latest" ]; then
            FORCE_ARGS="--force"
          fi
          python3 ./ci/check_upstream.py \
            --base-image "${{ steps.meta.outputs.base_image }}" \
            --target-image "ghcr.io/${{ steps.meta.outputs.image_lower }}:latest" \
            ${FORCE_ARGS}

      - name: Set up Docker Buildx
        if: steps.check.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        if: steps.check.outputs.should_build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./ci/Dockerfile
          pull: true
          push: true
          provenance: false
          build-args: |
            BASE_IMAGE=${{ steps.meta.outputs.base_image }}
            UPSTREAM_DIGEST=${{ steps.check.outputs.upstream_digest }}
            PATCHER_SHA=${{ steps.check.outputs.patcher_sha }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and publish Media Operator Image
        if: steps.check.outputs.should_build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./kits/media-operator
          file: ./kits/media-operator/Dockerfile
          pull: true
          push: true
          provenance: false
          build-args: |
            BASE_IMAGE=ghcr.io/${{ steps.meta.outputs.image_lower }}:latest
          tags: ghcr.io/${{ steps.meta.outputs.image_lower }}:media
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and publish Antigravity Sandbox Kit (v3 Workload Kit)
        if: steps.check.outputs.should_build == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          KIT_TARGET="ghcr.io/${OWNER_LOWER}/antigravity-kit:latest"
          DOWNSTREAM_IMG="ghcr.io/${OWNER_LOWER}/antigravity-sbx-patched:latest"
          TAG_ARGS=("-t" "${KIT_TARGET}")
          EXTRA_ARGS=""
          if [ "${{ github.ref_type }}" = "tag" ]; then
            DOWNSTREAM_IMG="ghcr.io/${OWNER_LOWER}/antigravity-sbx-patched:${{ github.ref_name }}"
            TAG_ARGS+=("-t" "ghcr.io/${OWNER_LOWER}/antigravity-kit:${{ github.ref_name }}")
            EXTRA_ARGS="--additional-tags ${{ github.ref_name }}"
          fi
          echo "==> Building and publishing Antigravity v3 workload kit via Buildx..."
          docker buildx build "./kits/antigravity" \
            -f "./kits/antigravity/spec.yaml" \
            --build-arg BASE_IMAGE="${DOWNSTREAM_IMG}" \
            "${TAG_ARGS[@]}" \
            --push || {
              echo "Warning: Direct buildx push failed, retrying via package_kit.py fallback..."
              python3 ./ci/package_kit.py \
                --spec ./kits/antigravity/spec.yaml \
                --downstream-image "${DOWNSTREAM_IMG}" \
                --target "${KIT_TARGET}" \
                --fallback-repo "ghcr.io/${OWNER_LOWER}/antigravity-sbx-patched:kit" \
                --username "${{ github.actor }}" \
                --token "${{ secrets.GITHUB_TOKEN }}" \
                ${EXTRA_ARGS} \
                --push
            }

      - name: Build and publish Antigravity Local Services Sandbox Kit (v3 Workload Kit)
        if: steps.check.outputs.should_build == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          KIT_TARGET="ghcr.io/${OWNER_LOWER}/antigravity-local-kit:latest"
          DOWNSTREAM_IMG="ghcr.io/${OWNER_LOWER}/antigravity-sbx-patched:latest"
          TAG_ARGS=("-t" "${KIT_TARGET}")
          EXTRA_ARGS=""
          if [ "${{ github.ref_type }}" = "tag" ]; then
            DOWNSTREAM_IMG="ghcr.io/${OWNER_LOWER}/antigravity-sbx-patched:${{ github.ref_name }}"
            TAG_ARGS+=("-t" "ghcr.io/${OWNER_LOWER}/antigravity-local-kit:${{ github.ref_name }}")
            EXTRA_ARGS="--additional-tags ${{ github.ref_name }}"
          fi
          echo "==> Building and publishing Antigravity Local v3 workload kit via Buildx..."
          docker buildx build "./kits/antigravity-local" \
            -f "./kits/antigravity-local/spec.yaml" \
            --build-arg BASE_IMAGE="${DOWNSTREAM_IMG}" \
            "${TAG_ARGS[@]}" \
            --push || {
              echo "Warning: Direct buildx push failed, retrying via package_kit.py fallback..."
              python3 ./ci/package_kit.py \
                --spec ./kits/antigravity-local/spec.yaml \
                --downstream-image "${DOWNSTREAM_IMG}" \
                --target "${KIT_TARGET}" \
                --username "${{ github.actor }}" \
                --token "${{ secrets.GITHUB_TOKEN }}" \
                ${EXTRA_ARGS} \
                --push
            }

      - name: Build and publish Mixin Kits
        if: steps.check.outputs.should_build == 'true'
        continue-on-error: true
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          for kit in math-labs rpi-edge-node affine-mcp media-operator crawl4ai-searxng; do
            echo "==> Building and publishing mixin kit ${kit}..."
            docker buildx build "./kits/${kit}" \
              -f "./kits/${kit}/spec.yaml" \
              -t "ghcr.io/${OWNER_LOWER}/${kit}-kit:latest" \
              --push || echo "Warning: Could not push ${kit}-kit directly (requires package write permissions)"
          done

      - name: Prune old untagged GHCR versions
        if: steps.check.outputs.should_build == 'true'
        continue-on-error: true
        uses: actions/delete-package-versions@v5
        with:
          package-name: 'antigravity-sbx-patched'
          package-type: 'container'
          delete-only-untagged-versions: 'true'
          min-versions-to-keep: '5'
          token: ${{ secrets.GITHUB_TOKEN }}
