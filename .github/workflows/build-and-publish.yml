name: Build and Publish Antigravity SBX Patched Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      base_image:
        description: 'Upstream Base Image'
        required: true
        default: 'docker.io/sbx/antigravity-image:latest'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/antigravity-sbx-patched

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Codeberg Container Registry
        if: env.CODEBERG_TOKEN != ''
        uses: docker/login-action@v3
        with:
          registry: codeberg.org
          username: Retr0xCC
          password: ${{ secrets.CODEBERG_TOKEN }}
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}

      - name: Determine image tags
        id: meta
        run: |
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          TAGS="${IMAGE_LOWER}:latest"

          if [ -n "${{ secrets.CODEBERG_TOKEN }}" ]; then
            TAGS="${TAGS},codeberg.org/retr0xcc/antigravity-sbx-patched:latest"
            echo "==> Codeberg publishing enabled"
          fi

          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./ci/Dockerfile
          push: true
          build-args: |
            BASE_IMAGE=${{ github.event.inputs.base_image || 'docker.io/sbx/antigravity-image:latest' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
