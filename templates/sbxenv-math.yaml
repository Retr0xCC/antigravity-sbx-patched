schemaVersion: "1"
name: math-labs-workspace
agent: shell
workspace: .

sandboxOptions:
  template: ghcr.io/retr0xcc/antigravity-sbx-patched:latest
  memory: 8gb
  cpus: 4

kits:
  - ghcr.io/retr0xcc/math-labs-kit:latest

env:
  PYTHONUNBUFFERED: "1"
  GEMINI_API_KEY: "${GEMINI_API_KEY:-}"

# Exposed Ports (bind to 0.0.0.0 inside the container)
# ports:
#   - "8888:8888" # Jupyter Lab / Notebook server
