# ========================================================
# Docker Sandbox Declarative Environment Specification (sbxenv.yaml)
# Run with: sbx env run
# Plan with: sbx env plan
# ========================================================
schemaVersion: "1"
name: workspace
agent: antigravity
workspace: .

sandboxOptions:
  # Base image built with Antigravity CLI and pre-applied QNIX patch
  template: ghcr.io/Retr0xCC/antigravity-sbx-patched:latest
  memory: 8gb
  cpus: 4

# Attached Mixin Kits (uncomment desired toolchains)
kits:
  # - path: ./kits/math-labs
  # - path: ./kits/rpi-edge-node
  # - path: ./kits/affine-mcp

# Environment Variables
env:
  PYTHONUNBUFFERED: "1"
  AGY_CLI_DISABLE_AUTO_UPDATE: "true"

# Exposed Ports (bind to 0.0.0.0 inside the container)
# ports:
#   - "8080:8080"
#   - "8888:8888"
