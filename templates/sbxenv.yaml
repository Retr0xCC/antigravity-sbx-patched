# ========================================================
# Docker Sandbox Declarative Environment Specification (sbxenv.yaml)
# Run with: sbx env run
# Plan with: sbx env plan
#
# NOTE: 'agent: shell' is used because Docker SBX requires a built-in
# agent name. Inside the container, 'agy' is pre-installed and patched.
# For full agent capabilities (Gemini proxy credentials, Google network
# allowlist, and startup hooks), run the kit directly:
#   sbx run ghcr.io/retr0xcc/antigravity-kit:latest
# ========================================================
schemaVersion: "1"
name: workspace
agent: shell
workspace: .

sandboxOptions:
  # Base image built with Antigravity CLI and pre-applied QNIX patch
  template: ghcr.io/retr0xcc/antigravity-sbx-patched:latest
  memory: 8gb
  cpus: 4

# Attached Mixin Kits (OCI images from GHCR or local paths)
kits:
  # - ghcr.io/retr0xcc/math-labs-kit:latest
  # - ghcr.io/retr0xcc/rpi-edge-node-kit:latest
  # - ghcr.io/retr0xcc/affine-mcp-kit:latest
  # - ghcr.io/retr0xcc/media-operator-kit:latest

# Environment Variables
env:
  PYTHONUNBUFFERED: "1"
  AGY_CLI_DISABLE_AUTO_UPDATE: "true"
  GEMINI_API_KEY: "${GEMINI_API_KEY:-}"

# Exposed Ports (bind to 0.0.0.0 inside the container)
# ports:
#   - "8080:8080"
#   - "8888:8888"
